<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 / 注册 — 简柚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./design.css">
<style>
.auth { min-height: 100vh; display: grid; grid-template-columns: 46% 54%; }
.left {
  position: relative; overflow: hidden;
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(47,93,80,.4), transparent 60%),
    radial-gradient(700px 400px at 10% 110%, rgba(217,93,24,.14), transparent 55%),
    linear-gradient(165deg, #101714 0%, #16211c 55%, #1a2620 100%);
  color: #f4f1ea; display: flex; flex-direction: column; justify-content: center; padding: 80px;
}
.left .ghost { position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
  writing-mode: vertical-rl; font-family: var(--font-display); font-size: 170px; font-weight: 700;
  letter-spacing: 40px; color: rgba(244,241,234,.05); }
.left .kicker { font-size: 12px; letter-spacing: 6px; color: rgba(244,241,234,.5); margin-bottom: 24px; }
.left h1 { font-family: var(--font-display); font-size: 52px; font-weight: 700; letter-spacing: 8px; line-height: 1.35; }
.left h1 em { font-style: normal; color: var(--orange); }
.left p { margin-top: 22px; font-size: 14.5px; color: rgba(244,241,234,.6); letter-spacing: 2px; max-width: 380px; }
.left .rule { width: 56px; height: 3px; background: var(--orange); margin-top: 30px; border-radius: 2px; }
.right { display: flex; align-items: center; justify-content: center; background: var(--paper); }
.panel { width: 420px; }
.panel .ptitle { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 3px; }
.panel .psub { font-size: 13px; color: var(--muted); margin: 10px 0 30px; letter-spacing: 1px; }
.tabs { display: flex; gap: 8px; background: var(--paper-2); border-radius: 999px; padding: 5px; margin-bottom: 26px; }
.tabs span { flex: 1; text-align: center; font-size: 14px; padding: 9px 0; border-radius: 999px; color: var(--muted); letter-spacing: 2px; }
.tabs .on { background: #fff; color: var(--ink-900); font-weight: 600; box-shadow: 0 2px 8px rgba(38,36,31,.08); }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: #55524a; margin-bottom: 8px; letter-spacing: 1px; }
.field .inp { display: flex; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 0 16px; }
.field .inp.focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(217,93,24,.12); }
.field .inp span.txt { flex: 1; padding: 13px 0; font-size: 14.5px; color: #26241f; }
.field .inp span.holder { padding: 13px 0; font-size: 14px; color: #b3aea3; }
.field .inp .cap { font-size: 13px; color: var(--orange); letter-spacing: 1px; border-left: 1px solid var(--line); padding-left: 14px; margin-left: 10px; white-space: nowrap; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.submit { display: block; width: 100%; text-align: center; background: var(--orange); color: #fff;
  border-radius: 999px; padding: 14px 0; font-size: 15px; letter-spacing: 6px; margin-top: 8px;
  box-shadow: 0 8px 22px rgba(217,93,24,.28); }
.agree { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 12.5px; color: var(--muted); }
.agree .box { width: 15px; height: 15px; border-radius: 4px; background: var(--orange); position: relative; }
.agree .box::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
.switch { text-align: center; margin-top: 26px; font-size: 13.5px; color: var(--muted); letter-spacing: 1px; }
.switch b { color: var(--orange); font-weight: 600; }
</style>
</head>
<body>

<div class="auth">
  <div class="left">
    <div class="ghost">简柚</div>
    <div class="kicker">JIANYOU · 成长记录本</div>
    <h1>慢慢写，<br>慢慢<em>长</em>。</h1>
    <p>登录以后，可以留言、点赞、收藏你喜欢的记录。</p>
    <div class="rule"></div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="ptitle">注册账号</div>
      <div class="psub">仅支持手机号或邮箱注册，账号即登录凭证</div>

      <div class="tabs"><span class="on">手机号注册</span><span>邮箱注册</span></div>

      <div class="field">
        <label>手机号</label>
        <div class="inp focus"><span class="txt">138****3305</span></div>
        <div class="hint">仅用于登录与找回密码，不会公开展示</div>
      </div>

      <div class="field">
        <label>验证码</label>
        <div class="inp"><span class="txt">6 位数字验证码</span><span class="cap">59s 后重发</span></div>
      </div>

      <div class="field">
        <label>设置密码</label>
        <div class="inp"><span class="holder">8–20 位，须包含字母和数字</span></div>
      </div>

      <a class="submit">注 册</a>
      <div class="agree"><span class="box"></span>我已阅读并同意《用户协议》与《隐私声明》</div>

      <div class="switch">已经有账号了？<b>直接登录 →</b></div>
    </div>
  </div>
</div>

</body>
</html>
