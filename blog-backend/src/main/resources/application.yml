server:
  port: 8080
  servlet:
    # 与前端 axios baseURL('/api') 对齐，前端代理无需 rewrite
    context-path: /api

spring:
  application:
    name: blog-backend
  servlet:
    multipart:
      # 单文件上限：图片 ≤5MB、头像 ≤2MB、音频（mp3/flac）≤1028MB，由 StorageService 按用途二次校验
      # max-request-size 是整个 multipart 请求体上限，必须大于单文件上限（含边界与表单开销），
      # 故取 2056MB；它本身不是音频的体积限制，真正的音频上限是 1028MB
      max-file-size: 1028MB
      max-request-size: 2056MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:jianyou_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:jianyou}
    password: ${MYSQL_PASSWORD:jianyou2026}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  jackson:
    # 全局日期格式，与前端 types 中的 'yyyy-MM-dd HH:mm:ss' 一致
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# JWT 配置（生产环境用环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:jianyou-blog-jwt-secret-please-override-in-production-0123456789}
  # access 短效令牌：每次请求携带，过期后前端用 refresh 静默换发（默认 2 小时）
  access-hours: 2
  # refresh 长效令牌：仅用于换发 access，jti 登记 Redis（blog:auth:refresh:*），删除即撤销（默认 7 天）
  refresh-days: 7

# 验证码（找回密码用；验证码存 Redis，t_user 不增字段）
verify:
  # 开发模式：验证码不发真实短信/邮件，而是随接口响应回传前端便于联调。
  # TODO 接入真实通道后必须改为 false（或设环境变量 VERIFY_DEV_MODE=false）
  dev-mode: ${VERIFY_DEV_MODE:true}
  code-length: 6
  expire-minutes: 5
  resend-seconds: 60
  max-fail-count: 5

# MinIO 对象存储（图片上传；生产用环境变量覆盖）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin2026}
  bucket: ${MINIO_BUCKET:jianyou-blog}
  # 浏览器访问前缀（本地开发与 endpoint 相同；生产可配 nginx 反代地址）
  access-url: ${MINIO_ACCESS_URL:http://localhost:9000}

# 客户端 IP 与访问日志（生产化口径）
app:
  # 可信反向代理 IP 列表：仅当请求的直接来源在此列表时才采信 X-Forwarded-For，
  # 其余来源一律使用 TCP 层真实地址（防止客户端伪造 XFF 污染归属地统计）。
  # 本机开发含回环地址，便于联调时用 X-Forwarded-For 模拟多地区访客；
  # 生产部署应改为反向代理的内网地址（如 nginx 主机内网 IP），环境变量 APP_TRUSTED_PROXIES 覆盖
  trusted-proxies: ${APP_TRUSTED_PROXIES:127.0.0.1,::1}
  visit-log:
    # 访问日志保留天数，超期由定时任务删除（防止表无限增长）
    retention-days: ${VISIT_LOG_RETENTION_DAYS:90}
    # 清理执行时间（cron，默认每天凌晨 4 点）；分批删除不锁长事务
    purge-cron: ${VISIT_LOG_PURGE_CRON:0 0 4 * * ?}

logging:
  level:
    com.jianyou.blog: info

# 站点配置（SiteService 读取）
site:
  site-name: 简柚
  site-subtitle: 把日子写下来
  site-logo: /logo.svg
  site-description: 一个记录学习路程与日常的个人空间
  site-keywords: 个人博客, 大学生活, 随笔, 记录
  site-author: 简之航
  author-avatar: ""
  author-bio: 软件技术专业在读。不太会说话，所以写下来。
  icp-number: ""
  police-number: ""
  copyright: "© 2026 简柚"
  github-url: https://github.com
  email-address: admin@jianyou.com
  about-content: ""
