# 后端 API 与 MinIO 的地址交给 Docker 内置 DNS 在【请求时】解析，而不是启动时
# ------------------------------------------------------------
# 默认写法 proxy_pass http://backend:8080/ 会在 nginx 启动时解析一次主机名；
# 解析不到 nginx 直接 [emerg] 退出 → 整个前端站点（含静态页）全挂。
# 用变量 + resolver 后改为请求时解析，后端/对象存储短暂不可用时只有接口 502，
# 静态页面照常访问。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 隐藏版本号，减少指纹暴露
    server_tokens off;

    # 上传体积上限（与后端 application.yml 的 max-request-size: 2056MB 对齐）
    # 不设此项时 nginx 默认 1MB，Docker 下所有 >1MB 的上传都会 413
    # 口径：图片 ≤5MB、头像 ≤2MB、音频（mp3/flac）≤1028MB
    client_max_body_size 2056m;
    client_body_timeout 300s;

    # ---------- 安全响应头 ----------
    # ⚠ nginx 继承规则：只要某个 location 内声明了任意一条 add_header，
    #   server 级的全部 add_header 就不会下发。所以安全头不能写在 server 级，
    #   必须写进 snippet，在每个 location 里 include 一次。
    #   文件由 Dockerfile 用 heredoc 写入 /etc/nginx/snippets/security-headers.conf
    include /etc/nginx/snippets/security-headers.conf;

    # 静态资源长缓存（带 hash，可安全缓存）
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        expires 30d;
    }
    # MinIO 对象存储反向代理
    # 配合后端 MINIO_ACCESS_URL=/files，浏览器拿到的是相对路径，
    # 无论站点部署在 localhost 还是 ngrok/公网域名都不会失效。
    location /files/ {
        include /etc/nginx/snippets/security-headers.conf;
        # 用变量改写地址 → 交给 resolver 在请求时解析（见文件顶部说明）
        # ⚠ 必须剥掉 /files 前缀：rewrite 在 proxy_pass 带变量时不会自动去掉 location 前缀，
        #   否则请求会变成 minio:9000/files/xxx，MinIO 把 "files" 当成桶名 → 403 AccessDenied
        #   （错误体里 BucketName 显示为 files 就是这个原因）
        set $minio_upstream http://minio:9000;
        rewrite ^/files/(.*)$ /$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # 后端 API 反向代理（backend 为 compose 服务名）
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传耗时较长，读超时从 30s 放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        # 接口响应一律不缓存，避免登录态/列表数据被中间层复用
        add_header Cache-Control "no-store" always;
    }

    # index.html 不缓存：发版后用户能立即拿到新的资源引用
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 路由兜底（内部重定向到 /index.html，继承的是本 location 的配置）
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
