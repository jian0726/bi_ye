server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（与后端 application.yml 的 max-request-size: 2056MB 对齐）
    # 不设此项时 nginx 默认 1MB，Docker 下所有 >1MB 的上传都会 413
    # 口径：图片 ≤5MB、头像 ≤2MB、音频（mp3/flac）≤1028MB
    client_max_body_size 2056m;
    client_body_timeout 300s;

    # 静态资源长缓存（带 hash，可安全缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理（backend 为 compose 服务名）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 大文件上传耗时较长，读超时从 30s 放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1k;
}
