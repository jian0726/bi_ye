server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 隐藏版本号，减少指纹暴露
    server_tokens off;

    # 上传体积上限（与后端 application.yml 的 max-request-size: 2056MB 对齐）
    # 不设此项时 nginx 默认 1MB，Docker 下所有 >1MB 的上传都会 413
    # 口径：图片 ≤5MB、头像 ≤2MB、音频（mp3/flac）≤1028MB
    client_max_body_size 2056m;
    client_body_timeout 300s;

    # ---------- 安全响应头 ----------
    # 禁止浏览器猜测 MIME（防止上传的 html 被当作页面执行）
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止被第三方页面用 iframe 嵌套，防点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 来源信息只带域名，跨站跳转不泄漏完整路径
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 关闭不需要的浏览器能力
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP：默认只允许同源，图片/媒体额外放行 data: 与 blob:（相册与音频播放需要）
    # style-src 需 'unsafe-inline'：Vue 运行时与 Element Plus 会注入内联样式
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;

    # 静态资源长缓存（带 hash，可安全缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 内重新声明 add_header 会覆盖 server 级配置，故此处补回安全头
        add_header X-Content-Type-Options "nosniff" always;
    }

    # MinIO 对象存储反向代理
    # 配合后端 MINIO_ACCESS_URL=/files，浏览器拿到的是相对路径，
    # 无论站点部署在 localhost 还是 ngrok/公网域名都不会失效。
    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 后端 API 反向代理（backend 为 compose 服务名）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传耗时较长，读超时从 30s 放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        # 接口响应一律不缓存，避免登录态/列表数据被中间层复用
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：发版后用户能立即拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
